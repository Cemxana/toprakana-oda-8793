<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Toprak Ana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e1d6;--dim:#7d746b;--bg:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
#c{position:fixed;inset:0;width:100%;height:100%;outline:none;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
.dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(233,225,214,.5);pointer-events:none;z-index:4;opacity:0;transition:all .3s}
.dot.on{opacity:1}
.dot.palm{width:26px;height:26px;margin:-13px 0 0 -13px;background:rgba(255,138,112,.18);box-shadow:0 0 0 1px rgba(255,160,130,.9)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1.6s ease 1s}
#hud.on{opacity:1}
.top{position:absolute;left:22px;top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);line-height:1.7}
.top b{font-weight:400;color:var(--ink)}
.tr{position:absolute;right:20px;top:14px;display:flex;gap:8px;pointer-events:auto}
.tr button,.langsw button,.palmbtn{background:none;border:1px solid rgba(233,225,214,.2);color:var(--dim);font:inherit;font-size:11px;letter-spacing:.12em;padding:5px 9px;cursor:pointer;border-radius:2px}
.tr button:hover,.tr button.act,.langsw button.act,.palmbtn:hover{color:var(--ink);border-color:rgba(233,225,214,.55)}
.bl{position:absolute;left:22px;bottom:18px;font-size:10.5px;letter-spacing:.1em;color:var(--dim);line-height:1.9;pointer-events:auto;max-width:60%}
.palmbtn{position:absolute;right:20px;bottom:18px;pointer-events:auto;padding:12px 18px;letter-spacing:.2em}
.palmbtn.on{color:#ffb8a6;border-color:rgba(255,160,130,.9);background:rgba(255,138,112,.12)}
.cnt{position:absolute;left:0;right:0;top:62px;text-align:center;pointer-events:none;transition:opacity 1.2s}
.cnt .l{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.cnt .n{font-weight:300;font-size:22px;letter-spacing:.1em;color:#a89f94;font-variant-numeric:tabular-nums;margin-top:4px}
.cap{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(18px,2.4vw,26px);color:#d8d0c4;letter-spacing:.02em;opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-shadow:0 0 18px #000}
#hud.quiet .cap{opacity:0!important}
.cnt .l2{font-size:9px;letter-spacing:.16em;color:#5d564f;margin-top:3px}
.sim{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5d564f}
#hud.quiet .cnt,#hud.quiet .bl,#hud.quiet .top,#hud.quiet .tr,#hud.quiet .palmbtn,#hud.quiet .sim{opacity:0;transition:opacity 1.2s}
#intro{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 1.8s ease;overflow:auto}
#intro.out{opacity:0;pointer-events:none}
.col{max-width:600px;padding:40px 26px;text-align:left}
.col h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(40px,7vw,68px);letter-spacing:.04em;margin-bottom:30px}
.col p{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(19px,2.5vw,24px);line-height:1.55;color:#d8d0c4;margin-bottom:20px}
.col p.cmd{font-style:italic;color:var(--ink);letter-spacing:.03em;margin-top:30px}
.col .note{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--dim);line-height:1.8;margin-top:6px}
.col .go{margin-top:30px;background:none;border:1px solid rgba(233,225,214,.5);color:var(--ink);font:inherit;font-size:12px;letter-spacing:.24em;text-transform:uppercase;padding:13px 26px;cursor:pointer;border-radius:2px;transition:all .3s}
.col .go:hover{background:rgba(233,225,214,.1);border-color:var(--ink)}
.rv{opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease}
.rv.in{opacity:1;transform:none}
.langsw{position:fixed;right:20px;top:14px;z-index:11;display:flex;gap:8px}
#err{position:fixed;left:20px;bottom:50px;z-index:20;color:#ff9a86;font-size:12px;display:none;max-width:70ch}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="dot" id="dot"></div>

<div id="hud">
  <div class="top"><b data-i="iTitle"></b><br><span data-i="credit"></span></div>
  <div class="tr"><button data-l="tr">TR</button><button data-l="en">EN</button><button id="bSnd" data-i="snd">ses</button></div>
  <div class="bl"><span data-i="hint"></span></div>
  <div class="cnt" id="cntBox"><div class="l" data-i="cntL"></div><div class="n" id="cnt">0</div><div class="l2" id="cntSpd"></div></div>
  <div class="cap" id="cap"></div>
  <button class="palmbtn" id="palmBtn" data-i="palm"></button>
</div>

<div class="langsw" id="langsw"><button data-l="tr" class="act">TR</button><button data-l="en">EN</button></div>
<div id="intro"><div class="col">
  <h1 class="rv" data-i="iTitle"></h1>
  <p class="rv" data-i="i1"></p>
  <p class="rv" data-i="i2"></p>
  <p class="rv cmd" data-i="i3"></p>
  <div class="note rv" data-i="iProto"></div>
  <button class="go rv" id="go" data-i="go"></button>
</div></div>
<div id="err"></div>

});

/* ---------- döngü ---------- */
const pickP=m=>m===paint;
const RIP=[0,1,2].map(()=>({x:0,y:0,age:1,dur:6,R:5}));
let ripTimer=3;
function spawnRipple(){
  const r=RIP.find(o=>o.age>=1); if(!r)return;
  const k=Math.random();
  const o=k<.6?t2e(.5,.70):(k<.8?t2e(.47,.96):[(Math.random()-.5)*2.4,(Math.random()-.5)*2.6]);
  r.x=o[0]; r.y=o[1]; r.age=0; r.dur=5+Math.random()*3; r.R=4.2+Math.random()*1.4;

const ringMeshes=["field","feed","spiral"].map(n=>scene.getMeshByName(n));
const trail=[]; for(let i=0;i<8;i++)trail.push({u:-1,v:-1,s:0});
let lastPh=0,beatClock=0,tAcc=0,frameN=0,lastGu=-1,lastGv=-1;
const center=new B.Vector3(0,PCY,PZ);
scene.onBeforeRenderObservable.add(()=>{
 const dt=Math.min(engine.getDeltaTime()/1000,.1); S.t+=dt;
 {
  const nowS=performance.now()/1000;
  if(S.entered&&S.auto&&nowS-S.userAt>25){
    S.autoOn=true;
    S.autoT=(S.autoT+dt)%52;
    const a=S.autoT, ease=x=>x*x*(3-2*x);
    let z;
    if(a<6)z=-6.0; else if(a<14)z=-6.0+ease((a-6)/8)*2.6; else if(a<46)z=-3.4; else z=-3.4-ease((a-46)/6)*2.6;
    cam.position.x=Math.sin(S.t*.2)*.25; cam.position.z=z;
    cam.rotation.set(.03,Math.sin(S.t*.15)*.03,0); cam.cameraDirection.set(0,0,0);
    const wantPalm=(a>=18&&a<36)?1:0; if(wantPalm!==S.palmT)palmSet(wantPalm);
    setCap(a<6?0:a<14?1:a<18?2:a<24?3:a<30?4:a<36?5:a<46?6:7);
  }else if(S.autoOn){S.autoOn=false;setCap(-1);palmSet(0)}
 }
 cam.position.y=1.65;
 cam.position.x=Math.max(-HALF+.5,Math.min(HALF-.5,cam.position.x));
 cam.position.z=Math.max(-HALF+.5,Math.min(HALF-.5,cam.position.z));
 {const dx0=cam.position.x,dz0=cam.position.z-PZ,d0=Math.hypot(dx0,dz0);if(d0<.9){const kk=.9/Math.max(d0,1e-3);cam.position.x=dx0*kk;cam.position.z=PZ+dz0*kk}}
 cam.rotation.x=Math.max(-.7,Math.min(.7,cam.rotation.x));
 const dist=Math.hypot(cam.position.x-center.x,cam.position.z-center.z);
 let pT=Math.max(0,Math.min(1,(4.8-dist)/3.2)), hT=S.palmT;
 if(S.ext&&performance.now()-S.extAt<1500){pT=S.extP;hT=S.extH}
 S.prox+=(pT-S.prox)*Math.min(1,dt*3);
 S.palm+=(hT-S.palm)*Math.min(1,dt*.9);                 // avuç yavaşça açılır, yavaşça kapanır
 {
  const exh=(S.ext&&performance.now()-S.extAt<1500&&S.extHX!==undefined);
  const tx=exh?S.extHX:S.mxs, ty=exh?S.extHY:S.mys, ox=S.hx, oy=S.hy;
  S.hx+=(tx-S.hx)*Math.min(1,dt*2); S.hy+=(ty-S.hy)*Math.min(1,dt*2);
  S.hsp+=(Math.min(1,Math.hypot(S.hx-ox,S.hy-oy)/Math.max(dt,1e-3)*.4)-S.hsp)*Math.min(1,dt*2.5);
 }
 {
  const tgt=S.palm>.4?1:(S.prox>.3?.1:0);
  S.rise+=Math.max(-dt*.05,Math.min(dt*.08,tgt-S.rise));
 }
 let gu=-1,gv=-1;
 if(S.ext&&performance.now()-S.extAt<1500&&S.extU>=0){gu=S.extU;gv=S.extV}
 else{
  const pk=scene.pick(engine.getRenderWidth()/2,engine.getRenderHeight()/2,pickP);
  if(pk&&pk.hit){const uv=pk.getTextureCoordinates();if(uv){gu=(uv.x-.5)*EXPX+.5;gv=1-((uv.y-.5)*EXPY+.5)}}
 }
 if(gu<0){S.gu=-1;S.gv=-1}else{S.gu=S.gu<0?gu:S.gu+(gu-S.gu)*.25;S.gv=S.gv<0?gv:S.gv+(gv-S.gv)*.25}
 tAcc+=dt;
 for(const p of trail)p.s=Math.max(0,p.s-dt*.4);
 if(S.gu>=0&&tAcc>.07&&Math.hypot(S.gu-lastGu,S.gv-lastGv)>.015){
  tAcc=0; const p=trail.reduce((a,b)=>a.s<b.s?a:b); p.u=S.gu;p.v=S.gv;p.s=1; lastGu=S.gu;lastGv=S.gv;
 }
 const wv=S.palm, hy01=Math.max(0,Math.min(1,.5-.5*S.hy));
 beatClock+=dt/1.25; const ph=beatClock%1;
 const lub=Math.min(1,Math.exp(-Math.pow(ph/.09,2))+.7*Math.exp(-Math.pow((ph-.3)/.08,2)));
 S.wph=(S.wph+dt/(3.8-1.6*hy01))%1;
 const wav=.5+.5*Math.sin(S.wph*6.2832);
 S.beat=Math.min(1,lub*(1-wv)+wav*wv);
 if(S.entered){
  const vol=(.05+S.prox*.3)*(1-wv*.85);
  if(lastPh>ph)thump(vol,64);
  if(lastPh<.3&&ph>=.3)thump(vol*.7,54);
  updateWaveAudio(wv,S.prox,hy01,S.hx,wav);
  for(let i=0;i<10;i++){
   const z=i/9, lit=Math.min(1,Math.max(0,(S.rise-(.3+z*.55))/.08)), bl=.55+.45*Math.sin(S.t*.55+i*2.1);
   if(lit>.5&&bl>.97&&!(window._bl&&window._bl[i])){(window._bl=window._bl||[])[i]=true;blip(PENTA[i]*(.9+.2*hy01),.025*(.4+S.prox))}
   if(bl<.9&&window._bl)window._bl[i]=false;
  }
  if(drone)drone.gain.value=.012+S.prox*.04;
 }
 lastPh=ph;
 const t=S.t;
 {
  // ağaçtan geçen renk: altından kırmızıya yavaşça kayar, ara sıra parlar
  const cyc=.5+.5*Math.sin(S.t*.06), gl2=Math.pow(.5+.5*Math.sin(S.t*.021+1.3),5), bo=1+.28*gl2;
  const tint=new B.Vector3(1.*bo,(.82-.58*cyc)*bo,(.54-.4*cyc)*bo);
  pMat.setVector3("tint",tint);fieldMat.setVector3("tint",tint);feedMat.setVector3("tint",tint);spMat.setVector3("tint",tint);exMat.setVector3("tint",tint);S.tc=[Math.min(1,tint.x),Math.min(1,tint.y),Math.min(1,tint.z)];
 }
 paint.position.y=PCY+Math.sin(t*.25)*.014; paint.position.x=Math.sin(t*.14)*.012; paint.position.z=PZ+Math.sin(t*.19)*.02;
 paint.rotation.z=Math.sin(t*.21)*.011; paint.rotation.y=Math.sin(t*.16)*.028; paint.rotation.x=Math.sin(t*.13)*.009;
 pMat.setFloat("time",t);pMat.setFloat("prox",S.prox);pMat.setFloat("palm",S.palm);pMat.setFloat("beat",S.beat);
 pMat.setFloat("rise",S.rise);pMat.setFloat("melt",S.act);pMat.setFloat("wph",S.wph);pMat.setFloat("hy",hy01);pMat.setFloat("hspd",S.hsp);
 feedMat.setVector3("camPos",cam.position);feedMat.setFloat("time",t);feedMat.setFloat("prox",S.prox);feedMat.setFloat("palm",S.palm);feedMat.setFloat("rise",S.rise);feedMat.setFloat("wph",S.wph);
 pMat.setVector2("gaze",new B.Vector2(S.gu,S.gv));
 const fl=[];for(const p of trail)fl.push(p.u,p.v,p.s);
 pMat.setArray3("trail",fl);
 const evf=[];
 for(const e of EV){if(e.age<1)e.age+=dt/e.dur;evf.push(e.u,e.v,Math.min(e.age,1),e.type)}
 pMat.setArray4("ev",evf);

 {
  const tz=S.palm>.4?1:0;
  S.zero+=Math.max(-dt/(S.zsec*1.4),Math.min(dt/S.zsec,tz-S.zero));
  S.ex+=(S.exT-S.ex)*Math.min(1,dt*2);
  S.act+=Math.max(-dt*.12,Math.min(dt*.2,(S.palm>.4?1:0)-S.act));
  if(S.entered){
   S.cacc+=240000/365/86400*(S.demo?60:1)*dt*(1-Math.min(1,S.zero*1.2));
   while(S.cacc>=1){S.cacc-=1;S.count++}
   const shown=Math.round(S.count*(1-S.zero));
   if(shown!==S.shown){S.shown=shown;$("cnt").textContent=shown.toLocaleString(LANG==="tr"?"tr-TR":"en-US")}
   const sp=(LANG==="tr"?(S.demo?"60× hızlandırılmış gösterim":"gerçek hız")+" · sıfırlanma "+S.zsec+" sn":(S.demo?"60× accelerated display":"real speed")+" · zeroing "+S.zsec+" s");
   if($("cntSpd").textContent!==sp)$("cntSpd").textContent=sp;
  }
  exMat.setFloat("time",S.t);exMat.setFloat("prox",S.prox);exMat.setFloat("palm",S.palm);exMat.setFloat("rise",S.rise);exMat.setFloat("wph",S.wph);exMat.setFloat("exOn",S.ex);exMat.setFloat("act",S.act);
  if(S.act>.5){ripTimer-=dt;if(ripTimer<=0){spawnRipple();ripTimer=12+Math.random()*10}}
  const rf=[];for(const r of RIP){if(r.age<1)r.age+=dt/r.dur;rf.push(r.x,r.y,Math.min(r.age,1),r.R)}
  exMat.setArray4("rip",rf);
 }
 updateDigits(dt);
 if(S.prox>.12&&S.palm<.5){evTimer-=dt;if(evTimer<=0){spawnEvent();evTimer=(5.5-S.prox*3.4)*(.6+Math.random()*.8)}}
 S.ringV+=(S.ringOn-S.ringV)*Math.min(1,dt*2);ringMeshes.forEach(m=>m&&m.setEnabled(S.ringV>.02));fieldMat.setFloat("act",S.act*S.ringV);feedMat.setFloat("act",S.act*S.ringV);fieldMat.setVector3("camPos",cam.position);fieldMat.setFloat("time",t);fieldMat.setFloat("prox",S.prox);fieldMat.setFloat("palm",S.palm);fieldMat.setFloat("beat",S.beat);
 spMat.setFloat("time",t);spMat.setFloat("prox",S.prox);spMat.setFloat("palm",S.palm);
 wash.intensity=.04+S.prox*.18+S.beat*.04*S.prox;
});
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
window.__scene=scene; window.__S=S; window.__cam=cam;
}
